# ============================================================================
# SQA Framework — CI Quality Gates
# ----------------------------------------------------------------------------
# Runs on every Pull Request to `main` and every push to `main`.
# Every gate below must pass before a PR can merge (per branch protection).
# See docs/05-ci-cd-quality-gates.md for the rationale behind each gate.
#
# NOTE FOR DEVELOPERS:
# - Some steps use `if: hashFiles(...)` guards so the workflow works BOTH
#   with the current placeholder package.json AND with a real codebase later.
# - When real tests and coverage exist, the coverage upload activates
#   automatically — no workflow edit needed.
# ============================================================================

name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs of the same PR when a new commit is pushed.
# Saves CI minutes and ensures we only care about the latest result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default permissions to read-only.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # GATE 1 — Install dependencies
  # ---------------------------------------------------------------------------
  install:
    name: 'Gate 1 — Install Dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

  # ---------------------------------------------------------------------------
  # GATE 2 — Lint (ESLint)
  # ---------------------------------------------------------------------------
  lint:
    name: 'Gate 2 — Lint'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # GATE 3 — Type Check (TypeScript)
  # ---------------------------------------------------------------------------
  typecheck:
    name: 'Gate 3 — Type Check'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # GATE 4 — Unit Tests (Jest)
  # Coverage upload activates automatically when a coverage/ folder exists.
  # ---------------------------------------------------------------------------
  test-unit:
    name: 'Gate 4 — Unit Tests'
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Check for coverage output
        id: check_coverage
        run: |
          if [ -d "coverage" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No coverage folder yet — skipping upload. Will activate once real tests generate coverage."
          fi

      - name: Upload coverage artifact
        if: steps.check_coverage.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GATE 5 — Integration Tests (Jest + Supertest)
  # MongoDB service container starts only when actual tests need it.
  # For placeholder phase, it still starts (harmless) but tests just echo.
  # ---------------------------------------------------------------------------
  test-integration:
    name: 'Gate 5 — Integration Tests'
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: 'mongodb://localhost:27017/test'
      NODE_ENV: 'test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # GATE 6 — Build
  # ---------------------------------------------------------------------------
  build:
    name: 'Gate 6 — Build'
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  # ---------------------------------------------------------------------------
  # GATE 7 — Security Scan (npm audit)
  # Blocks on High or Critical vulnerabilities.
  # ---------------------------------------------------------------------------
  security:
    name: 'Gate 7 — Security Scan'
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high and critical only)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # GATE 8 — Coverage Threshold
  # Currently runs the placeholder. Real threshold enforcement happens
  # automatically once Jest config defines coverageThreshold.
  # ---------------------------------------------------------------------------
  coverage:
    name: 'Gate 8 — Coverage Threshold'
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce coverage thresholds
        run: npm run test:coverage

  # ---------------------------------------------------------------------------
  # FINAL GATE — confirms all required jobs passed
  # Branch protection points at THIS job — one rule covers everything.
  # ---------------------------------------------------------------------------
  all-checks-passed:
    name: 'All Quality Gates Passed'
    needs:
      - lint
      - typecheck
      - test-unit
      - test-integration
      - build
      - security
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Confirm success
        run: echo "✅ All quality gates passed. PR is ready for review."